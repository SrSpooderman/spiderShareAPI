services:
  api:
    build:
      context: .
    container_name: spidershare_api
    env_file:
      - path: stack.env
        required: false
      - path: .env
        required: false
    volumes:
      - video_storage:/app/storage/videos
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      spidershare_network:
    command: >
      sh -c "alembic -c /app/alembic.ini upgrade head &&
      python -m app.bootstrap.seed_super_admin &&
      uvicorn run:app --host 0.0.0.0 --port 8000 --no-access-log"

  worker:
    build:
      context: .
    container_name: jaimito_worker
    restart: unless-stopped
    env_file:
      - path: stack.env
        required: false
      - path: .env
        required: false
    volumes:
      - video_storage:/app/storage/videos
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      spidershare_network:
    command: python -m app.workers.video_processing

  backoffice:
    build:
      context: ./backoffice
      target: production
      args:
        VITE_API_BASE_URL: ${BACKOFFICE_PROXY_API_BASE_URL:-/api}
    container_name: spidershare_backoffice
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BACKOFFICE_PORT:-5173}:5173"
    depends_on:
      api:
        condition: service_started
    networks:
      spidershare_network:

  redis:
    image: redis:7-alpine
    container_name: spidershare_redis
    restart: unless-stopped
    networks:
      spidershare_network:
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mysql:
    image: mysql:8.4
    container_name: spidershare_mysql
    restart: unless-stopped
    env_file:
      - path: stack.env
        required: false
      - path: .env
        required: false
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-spidershare}
      MYSQL_USER: ${MYSQL_USER:-spidershare}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-spidershare_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      spidershare_network:
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_password}"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:1.27-alpine
    container_name: spidershare_nginx
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
      backoffice:
        condition: service_started
    environment:
      API_DOMAIN: ${API_DOMAIN}
      BACKOFFICE_DOMAIN: ${BACKOFFICE_DOMAIN}
      NGINX_CLIENT_MAX_BODY_SIZE: ${NGINX_CLIENT_MAX_BODY_SIZE:-600m}
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/templates/default.conf.template:ro
      - certbot_www:/var/www/certbot:ro
      - letsencrypt:/etc/letsencrypt:ro
    networks:
      spidershare_network:
    command: /bin/sh -c "envsubst '$$API_DOMAIN $$BACKOFFICE_DOMAIN $$NGINX_CLIENT_MAX_BODY_SIZE' < /etc/nginx/templates/default.conf.template > /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"

  nginx-bootstrap:
    image: nginx:1.27-alpine
    container_name: spidershare_nginx_bootstrap
    restart: unless-stopped
    profiles:
      - bootstrap
    environment:
      API_DOMAIN: ${API_DOMAIN}
      BACKOFFICE_DOMAIN: ${BACKOFFICE_DOMAIN}
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx/bootstrap.conf:/etc/nginx/templates/default.conf.template:ro
      - certbot_www:/var/www/certbot:ro
    networks:
      spidershare_network:
    command: /bin/sh -c "envsubst '$$API_DOMAIN $$BACKOFFICE_DOMAIN' < /etc/nginx/templates/default.conf.template > /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"

  certbot:
    image: certbot/certbot:latest
    container_name: spidershare_certbot
    volumes:
      - certbot_www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    networks:
      spidershare_network:

volumes:
  mysql_data:
  video_storage:
  certbot_www:
  letsencrypt:

networks:
  spidershare_network:
    driver: bridge
