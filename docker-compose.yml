services:
  api:
    build:
      context: .
    container_name: spidershare_api
    env_file:
      - path: stack.env
        required: false
      - path: .env
        required: false
    volumes:
      - video_storage:/app/storage/videos
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic -c /app/alembic.ini upgrade head &&
      python -m app.bootstrap.seed_super_admin &&
      uvicorn run:app --host 0.0.0.0 --port 8000 --no-access-log"

  worker:
    build:
      context: .
    container_name: jaimito_worker
    restart: unless-stopped
    env_file:
      - path: stack.env
        required: false
      - path: .env
        required: false
    volumes:
      - video_storage:/app/storage/videos
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python -m app.workers.video_processing

  backoffice:
    build:
      context: ./backoffice
      target: production
      args:
        VITE_API_BASE_URL: ${BACKOFFICE_API_BASE_URL:-http://localhost:8000}
    container_name: spidershare_backoffice
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BACKOFFICE_PORT:-5173}:5173"
    depends_on:
      api:
        condition: service_started

  redis:
    image: redis:7-alpine
    container_name: spidershare_redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mysql:
    image: mysql:8.4
    container_name: spidershare_mysql
    restart: unless-stopped
    env_file:
      - path: stack.env
        required: false
      - path: .env
        required: false
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-spidershare}
      MYSQL_USER: ${MYSQL_USER:-spidershare}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-spidershare_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_password}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
  video_storage:
